name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub 的 ubuntu runner 自带 Android SDK，不再用 setup-android（它在
      # cmdline-tools 16 上装 "tools" 包会失败）。缺 SDK 时才补装，且不让它中断构建。
      - name: 检查 Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-未设置}"
          ls "${ANDROID_HOME}/platforms" 2>/dev/null || true
          ls "${ANDROID_HOME}/build-tools" 2>/dev/null || true
          if [ ! -d "${ANDROID_HOME}/platforms/android-34" ]; then
            SDKMGR=$(ls -d "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
            if [ -n "${SDKMGR}" ]; then
              echo "补装 android-34：${SDKMGR}"
              yes | "${SDKMGR}" --licenses > /dev/null 2>&1 || true
              "${SDKMGR}" --install "platforms;android-34" "build-tools;34.0.0" || true
            fi
          fi
          ls "${ANDROID_HOME}/platforms" 2>/dev/null || true

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 安装前端依赖
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: 同步 web 资源到安卓工程
        run: npm run cap:sync

      - name: 编译 Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 记录 APK 信息
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          echo "### APK 构建成功 :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 文件 | 大小 |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          for f in android/app/build/outputs/apk/debug/*.apk; do
            echo "| $(basename $f) | $(du -h $f | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          done

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: screen-reader-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 90
